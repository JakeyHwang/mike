name: Release

# Tag `vX.Y.Z` → multi-arch application images on GHCR and a GitHub Release.
# Installed copies read the release (tag, notes) and the tag's source tarball
# (compose, schema, migrations), so images, tarball and release are always
# the same commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: jakeyhwang

jobs:
  images:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Build and push backend (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/mike-backend:${{ steps.tag.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,scope=backend-${{ matrix.arch }},mode=max
      - name: Build and push frontend (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/mike-frontend:${{ steps.tag.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=frontend-${{ matrix.arch }}
          cache-to: type=gha,scope=frontend-${{ matrix.arch }},mode=max

  manifests:
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge per-arch tags into one multi-arch tag
        run: |
          set -eu
          v="${GITHUB_REF_NAME}"
          for img in mike-backend mike-frontend; do
            ref="$REGISTRY/$OWNER/$img"
            docker buildx imagetools create -t "$ref:$v" -t "$ref:latest" "$ref:$v-amd64" "$ref:$v-arm64"
          done

  release:
    needs: manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
